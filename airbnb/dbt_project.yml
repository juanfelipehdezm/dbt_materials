# Name your project! Project names should contain only lowercase characters
# and underscores. A good package name should reflect your organization's
# name or the intended use of these models
name: "airbnb"
version: "1.0.0"

# This setting configures which "profile" dbt uses for this project.
profile: "airbnb"

# These configurations specify where dbt should look for different types of files.
# The `model-paths` config, for example, states that models in this project can be
# found in the "models/" directory. You probably won't need to change these!
model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]
asset-paths: ["assets"]

clean-targets: # directories to be removed by `dbt clean`
  - "target"
  - "dbt_packages"

# Configuring models
# Full documentation: https://docs.getdbt.com/docs/configuring-models

# In this example config, we tell dbt to build all models in the example/
# directory as views. These settings can be overridden in the individual model
# files using the `{{ config(...) }}` macro.
on-run-start: #hooks to run at the start of a dbt run, before any models are built
  - "CREATE TABLE IF NOT EXISTS {{ target.schema }}.audit_log ( model_name STRING, run_timestamp TIMESTAMP )"
models:
  airbnb:
    +grants:
      select: ["transform"] # grant select permissions on all models in the airbnb/ directory to the transform role
    +post-hook:
      - "INSERT INTO {{ target.schema }}.audit_log VALUES ('{{ this }}', CURRENT_TIMESTAMP)" #hooks to run after a model is built, in this case we are inserting a record into the audit_log table with the name of the model and the timestamp of when it was built
    +materialized: view # default materialization for all models in the airbnb project is 'view'
    dim:
      +materialized: table # models in the dim/ directory are materialized as tables
    src:
      +materialized: ephemeral # models in the src/ directory are ephemeral, if the model had another previous materialization it will be needed to be dropped first

data_tests:
  +store_failures: true # store the results of failed data tests in the target/ directory for debugging purposes
  +schema: _test_failures # store the results of failed data tests in a separate schema for better organization
flags:
  require_generic_test_arguments_property: true
