models:
  #tests for the cleansed dimension tables to ensure data quality and integrity
  - name: dim_listings_cleansed #this should be the same as the name of the model file in the models directory
    description: "Cleansed dimension table for Airbnb listings with data tests"
    columns:
      - name: listing_id
        data_tests:
          - unique
          - not_null

      - name: host_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_hosts_cleansed')
                field: host_id

      - name: room_type
        data_tests:
          - accepted_values:
              arguments:
                values:
                  [
                    "Entire home/apt",
                    "Private room",
                    "Shared room",
                    "Hotel room",
                  ]
