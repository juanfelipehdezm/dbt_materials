models:
  #schema tests for the cleansed dimension tables to ensure data quality and integrity
  - name: dim_listings_cleansed #this should be the same as the name of the model file in the models directory
    description: "Cleansed dimension table for Airbnb listings with data tests"
    data_tests:
      #model level tests
      - minimum_row_count:
          arguments:
            min_rows: 100
          config:
            severity: warn
    columns:
      #columen level tests
      - name: listing_id
        data_tests:
          - unique
          - not_null

      - name: host_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_hosts_cleansed')
                field: host_id

      - name: room_type
        data_tests:
          - accepted_values:
              arguments:
                values:
                  [
                    "Entire home/apt",
                    "Private room",
                    "Shared room",
                    "Hotel room",
                  ]
      - name: minimum_nights
        data_tests:
          - positive_values #this call the generic test we created in the tests/generic/positive_values.sql file to ensure that the minimum_nights column has only positive values

  #data contract for the cleansed dimension table to ensure that the data adheres to the defined schema and constraints
  - name: dim_hosts_cleansed
    config:
      contract:
        enforced: true
    columns:
      - name: host_id
        data_type: integer
      - name: host_name
        data_type: string
      - name: is_superhost
        data_type: string
      - name: updated_at
        data_type: timestamp
      - name: created_at
        data_type: timestamp
  #dbt expectation test to compare the row count of the dim_listings_w_hosts model with the source listings table to ensure that the data is consistent and complete after the transformation
  - name: dim_listings_w_hosts
    description: "Dimension table for Airbnb listings enriched with host information"
    tests:
      - dbt_expectations.expect_table_row_count_to_equal_other_table:
          arguments:
            compare_model: source('airbnb', 'listings')
    columns:
      - name: price
        tests:
          #dbt expectation test to check that the price column in the dim_listings_w_hosts model has values between 50 and 500 for the 99th percentile to ensure that the data is reasonable and does not contain outliers
          - dbt_expectations.expect_column_quantile_values_to_be_between:
              arguments:
                quantile: .99
                min_value: 50
                max_value: 500
          #dbt expectation test to check that the maximum value in the price column of the dim_listings_w_hosts model is between 5000 to ensure that there are no extreme outliers in the data
          - dbt_expectations.expect_column_max_to_be_between:
              arguments:
                max_value: 5000
                config:
                  severity: warn #this test will only raise a warning if it fails, allowing the dbt run to continue while still highlighting potential data quality issues
          - dbt_expectations.expect_column_values_to_be_of_type:
              arguments:
                column_type: number
